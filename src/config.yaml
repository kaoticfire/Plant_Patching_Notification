---
version: 1
disable_existing_loggers: False
formatters:
    simple:
        format: '%(asctime)s | %(name)s | %(levelname)s | %(message)s'
        datefmt: '%Y-%m-%d %H:%M:%S'
handlers:
    file:
        class: logging.handlers.RotatingFileHandler
        formatter: simple
        filename: 'note.log'
        mode: 'a'
        maxBytes: 10240
        backupCount: 0
loggers:
        'vhoover':
            level: INFO
            handlers:
             - file
